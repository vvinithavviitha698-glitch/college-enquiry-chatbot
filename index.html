<!DOCTYPE html>
<html>
<head>
    <title>PTA gaasc College Enquiry Chatbot System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">
    <h2>College Enquiry Chatbot</h2>
    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="Type your question..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
    let userMsg = document.getElementById("user-input").value;
    if (userMsg === "") return;

    let chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += "<p class='user'>You: " + userMsg + "</p>";

    fetch("/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg: userMsg })
    })
    .then(res => res.json())
    .then(data => {
        chatBox.innerHTML += "<p class='bot'>Bot: " + data.response + "</p>";
        document.getElementById("user-input").value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}
</script>

</body>
</html>
