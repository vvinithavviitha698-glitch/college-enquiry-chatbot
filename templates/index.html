<!DOCTYPE html>
<html>
<head>
    <title>College Enquiry Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }
        .chat-container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        #chat-box {
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .user {
            text-align: right;
            color: blue;
            margin: 5px;
        }
        .bot {
            text-align: left;
            color: green;
            margin: 5px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>College Enquiry Chatbot</h2>

    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="Ask your question" />
    <button onclick="sendMessage()">Send</button>
</div>

<script src="/static/js/script.js"></script>

</body>
</html>
